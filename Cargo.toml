[package]
name = "aron-rs-examples"
version = "0.1.0"
edition = "2024"
authors = ["Aronori"]

[dependencies]
base-infra = { git = "https://github.com/alonoril/infra-rs", rev = "022e23eb", features = ["tokio-pool"] }
base-util = { git = "https://github.com/alonoril/infra-rs", rev = "022e23eb" }
rksdb-infra = { git = "https://github.com/alonoril/infra-rs", rev = "022e23eb" }

chain-types = { git = "https://github.com/alonoril/chain-tools", rev = "f9bc85ab", features = ["endless"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
async-trait = "0.1"
futures = "0.3"

anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3.20"
serde = { version = "1", features = ["derive"] }
rand = "=0.8"
tracing-appender = "0.2.3"

# orm
sea-orm = { version = "1", features = ["time"] }
chrono = "0.4.42"

bytes.version = "1.11"
# eth
alloy-primitives = { version = "1.4", features = ["serde"] }
alloy-dyn-abi.version = "1.4"
reqwest = "0.12.24"

graphql_client = { version = "0.14" }
serde_json = "1.0.82"
bincode = { version = "2.0.1", features = ["serde"] }
