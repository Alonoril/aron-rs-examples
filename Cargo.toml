[package]
name = "aron-rs-examples"
version = "0.1.0"
edition = "2024"
authors = ["Aronori"]

[dependencies]
base-infra = { git = "https://github.com/alonoril/infra-rs", rev = "d86574f", features = ["tokio-pool"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
async-trait = "0.1"

anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3.20"
serde = { version = "1", features = ["derive"] }
rand = "=0.8"
tracing-appender = "0.2.3"


bytes.version = "1.11"
# eth
alloy-primitives = { version = "1.4", features = ["serde"] }
alloy-dyn-abi.version = "1.4"